<title>XHS Studio 控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* ════════════════════════════════════════════════════════════════
   XHS Studio 控制台 · UI 原型 v2（纯静态，数据写死）
   调色板 = 项目自己的 tech_night：#05060a 底 / #3ddc97 主色 / #4d8cff 次色
   单一深色主题是刻意的：控制台就该看起来像它管理的那台机器。
   ════════════════════════════════════════════════════════════════ */
:root {
  --bg:      #05060a;
  --panel:   #0b101c;
  --panel-2: #0f1524;
  --line:    #1c2436;
  --line-2:  #141b2a;
  --ink:     #f2f5fa;
  --ink-2:   #b9c3d4;
  --dim:     #78859b;
  --acc:     #3ddc97;
  --acc-2:   #4d8cff;
  --ok:      #3ddc97;
  --warn:    #e5ad55;
  --bad:     #f4796a;

  --display: "Familjen Grotesk", "PingFang SC", "Noto Sans SC", sans-serif;
  --body: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", "Source Han Sans SC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --nav-w: 196px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 13.5px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: var(--acc-2); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--acc-2); outline-offset: 2px; border-radius: 3px; }
code { font-family: var(--mono); font-size: .88em; }

/* 深色界面里的滚动条 —— 默认亮白滚动条在这套配色里非常刺眼 */
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
*::-webkit-scrollbar { height: 9px; width: 9px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
*::-webkit-scrollbar-thumb:hover { background: #2b3648; }

/* ── 骨架 ── */
.shell { display: grid; grid-template-columns: var(--nav-w) 1fr; min-height: 100%; }

/* ── 导航 ── */
.nav {
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 18px 0 20px;
  display: flex; flex-direction: column; gap: 1px;
  position: sticky; top: 0; align-self: start; height: 100vh;
}
.brand {
  font-family: var(--display);
  font-size: 12.5px; font-weight: 700; letter-spacing: .1em;
  color: var(--acc); padding: 0 16px 16px;
  display: flex; align-items: center; gap: 8px;
}
.brand .sq { width: 13px; height: 13px; border-radius: 3px; background: linear-gradient(135deg, var(--acc), var(--acc-2)); flex: none; }
.nav button {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  padding: 7px 16px; color: var(--dim);
  border-left: 2px solid transparent; font-size: 13px;
}
.nav button:hover { color: var(--ink-2); background: rgba(255,255,255,.025); }
.nav button[aria-current="page"] { color: var(--ink); background: rgba(61,220,151,.07); border-left-color: var(--acc); }
/* 导航上的数字只有一个含义：需要你处理的条数。总数不上导航。 */
.nav .badge {
  margin-left: auto; font-family: var(--mono); font-size: 10.5px; font-weight: 500;
  padding: 0 6px; border-radius: 9px; font-variant-numeric: tabular-nums;
}
.nav .badge.act { background: rgba(229,173,85,.18); color: var(--warn); }
.nav .badge.bad { background: rgba(244,121,106,.18); color: var(--bad); }
.nav .sep { height: 1px; background: var(--line); margin: 10px 16px; }
.nav-foot { margin-top: auto; padding: 0 16px; font-family: var(--mono); font-size: 10px; color: var(--dim); line-height: 1.7; }

/* ── 主区 ── */
.main { min-width: 0; padding: 22px 26px 64px; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.head h1 { font-size: 20px; font-weight: 600; margin: 0 0 3px; letter-spacing: -.01em; text-wrap: balance; }
.head .sub { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.head .acts { display: flex; gap: 8px; }
.back { font-family: var(--mono); font-size: 11px; color: var(--dim); padding: 0 0 6px; display: inline-flex; gap: 6px; align-items: center; }
.back:hover { color: var(--acc-2); }

.btn { font-size: 12px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink-2); background: var(--panel-2); white-space: nowrap; }
.btn:hover { border-color: var(--dim); color: var(--ink); }
.btn.primary { background: var(--acc); border-color: var(--acc); color: #04120c; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { border-color: rgba(244,121,106,.5); color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: default; }

/* ── 标签 ── */
.tag { display: inline-block; font-family: var(--mono); font-size: 10.5px; padding: 1px 7px; border-radius: 2px; white-space: nowrap; }
.tag.ok   { background: rgba(61,220,151,.14); color: var(--ok); }
.tag.run  { background: rgba(77,140,255,.16); color: var(--acc-2); }
.tag.wait { background: rgba(229,173,85,.16); color: var(--warn); }
.tag.bad  { background: rgba(244,121,106,.16); color: var(--bad); }
.tag.off  { background: rgba(255,255,255,.06); color: var(--dim); }
.tag.vid  { background: rgba(77,140,255,.13); color: var(--acc-2); }
.tag.art  { background: rgba(255,255,255,.07); color: var(--dim); }

/* ── 筛选 / 排序 ── */
.bar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 12px; }
.seg { display: flex; align-items: center; gap: 6px; }
.seg > .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.seg .opts { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg .opts button { font-family: var(--mono); font-size: 11.5px; padding: 3px 10px; color: var(--dim); border-right: 1px solid var(--line); }
.seg .opts button:last-child { border-right: none; }
.seg .opts button:hover { color: var(--ink-2); background: rgba(255,255,255,.03); }
.seg .opts button[aria-pressed="true"] { background: rgba(255,255,255,.07); color: var(--ink); }
.bar .spacer { flex: 1 1 auto; }
.bar .count { font-family: var(--mono); font-size: 11px; color: var(--dim); }

/* ── 表格 ── */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; min-width: 700px; }
th {
  font-family: var(--display); font-size: 10px; font-weight: 600;
  letter-spacing: .09em; text-transform: uppercase; color: var(--dim);
  text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line);
  white-space: nowrap; background: var(--panel-2); position: sticky; top: 0; z-index: 2;
}
td { padding: 9px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover td { background: rgba(77,140,255,.05); }
/* 行首色条：需要你动手的任务，扫一眼就分得出来 */
tbody tr td:first-child { border-left: 2px solid transparent; }
tbody tr.act td:first-child { border-left-color: var(--warn); }
tbody tr.err td:first-child { border-left-color: var(--bad); }
td.mono, th.mono { font-family: var(--mono); font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
td .ttl { font-weight: 500; }
td .meta { font-family: var(--mono); font-size: 10px; color: var(--dim); display: block; margin-top: 1px; }
.groupdiv td {
  background: var(--panel-2); font-family: var(--mono); font-size: 10px;
  letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
  padding: 6px 14px; border-bottom: 1px solid var(--line);
}

/* ── 错误横幅：失败任务顶部第一眼看到的东西 ── */
.banner {
  border: 1px solid rgba(244,121,106,.4); border-left: 3px solid var(--bad);
  background: rgba(244,121,106,.06); border-radius: 4px;
  padding: 13px 16px; margin-bottom: 16px;
  display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap;
}
.banner .t { font-weight: 600; font-size: 13.5px; color: var(--ink); }
.banner .d { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); margin-top: 3px; line-height: 1.6; }
.banner .fix { font-size: 12px; color: var(--warn); margin-top: 6px; }
.banner .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ── 一致性校验条 ── */
.check { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 16px; background: var(--panel); }
.check > div { flex: 1 1 120px; padding: 9px 14px; border-right: 1px solid var(--line); min-width: 0; }
.check > div:last-child { border-right: none; }
.check .k { font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); display: block; }
.check .v { font-family: var(--mono); font-size: 16px; font-variant-numeric: tabular-nums; color: var(--ink); }
.check .v.good { color: var(--acc); }
.check .v.bad { color: var(--bad); }
.check .v.na { color: var(--dim); }

/* ── 任务主干 ── */
.trunk { list-style: none; margin: 0; padding: 0; }
.trunk > li { display: grid; grid-template-columns: 16px 1fr; gap: 13px; }
.rail { position: relative; }
.rail::before { content: ""; position: absolute; left: 7px; top: 17px; bottom: -2px; width: 1px; background: var(--line); }
.trunk > li:last-child .rail::before { display: none; }
.node { width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 2px solid var(--acc); margin: 7px 0 0 3px; position: relative; z-index: 1; }
.node.wait { border-color: var(--warn); }
.node.todo { border-color: var(--line); }
.node.bad  { border-color: var(--bad); }
.step { padding-bottom: 16px; min-width: 0; }
.step-h { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.step-h b { font-size: 13.5px; font-weight: 600; }
.step-h .when { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-left: auto; }
.step-d { color: var(--dim); font-size: 12px; margin-top: 3px; }
.step-d .hl { color: var(--ink-2); }
.step-actions { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }

/* ── 子流水线 ── */
.sub { margin-top: 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); overflow: hidden; }
.sub-h {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--dim); padding: 7px 13px; border-bottom: 1px solid var(--line); background: var(--panel-2);
  display: flex; justify-content: space-between; gap: 10px;
}
.sub-row { display: grid; grid-template-columns: 112px 1fr auto; gap: 12px; padding: 8px 13px; border-bottom: 1px solid var(--line-2); align-items: center; font-size: 12px; }
.sub-row:last-child { border-bottom: none; }
.sub-row.failed { background: rgba(244,121,106,.06); }
.sub-row .en { font-family: var(--mono); font-size: 10.5px; color: var(--acc-2); }
.sub-row.failed .en { color: var(--bad); }
.sub-row .d { color: var(--dim); min-width: 0; }
.sub-row .d .hl { color: var(--ink-2); }
.sub-row .d .warnx { color: var(--warn); }
.sub-row .d .badx { color: var(--bad); }
.sub-row .t { font-family: var(--mono); font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }

/* ── 工具体检：列表而非网格，避免末行空洞；按严重度排序 ── */
.tools { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--panel); }
.tool { display: grid; grid-template-columns: 172px 1fr auto; gap: 14px; padding: 11px 15px; border-bottom: 1px solid var(--line-2); align-items: center; }
.tool:last-child { border-bottom: none; }
.tool.bad { background: rgba(244,121,106,.05); }
.tool.wait { background: rgba(229,173,85,.04); }
.tool .n { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 9px; }
.tool .body { min-width: 0; }
.tool .x { font-family: var(--mono); font-size: 11px; color: var(--dim); display: block; line-height: 1.55; }
.tool .fix { font-size: 12px; color: var(--warn); margin-top: 3px; display: block; }
.tool .fix code { color: var(--ink-2); background: rgba(255,255,255,.05); padding: 1px 5px; border-radius: 2px; }
.tool .go { display: flex; gap: 8px; }

/* ── 资产：按任务分组，统一比例，带操作 ── */
.agroup { margin-bottom: 22px; }
.agroup > h3 {
  font-size: 13px; font-weight: 600; margin: 0 0 3px;
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
}
.agroup > .p { font-family: var(--mono); font-size: 10.5px; color: var(--dim); margin: 0 0 10px; }
.assets { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 12px; }
.asset { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--panel); display: flex; flex-direction: column; }
/* 统一 4:3 取景框，内部再按真实比例摆放 —— 卡片高度一致，不再参差 */
.asset .frame {
  aspect-ratio: 4 / 3; max-width: 100%;
  background: #04050a; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center; padding: 10px;
}
.asset .shot {
  position: relative; height: 100%; border-radius: 2px; overflow: hidden;
  display: flex; align-items: flex-end; padding: 7px;
  background: linear-gradient(155deg, #0e1729, #05060a 70%);
  border: 1px solid var(--line);
}
.asset .shot.r916 { aspect-ratio: 9 / 16; }
.asset .shot.r169 { aspect-ratio: 16 / 9; }
.asset .shot.r34  { aspect-ratio: 3 / 4; }
.asset .shot::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle at 32% 28%, rgba(61,220,151,.18), transparent 60%),
              radial-gradient(circle at 74% 74%, rgba(77,140,255,.16), transparent 56%);
}
.asset .kind {
  position: absolute; top: 6px; left: 6px; z-index: 2;
  font-family: var(--mono); font-size: 9px; letter-spacing: .04em;
  background: rgba(0,0,0,.66); border: 1px solid rgba(255,255,255,.14);
  padding: 1px 5px; border-radius: 2px; color: var(--ink-2);
}
.asset .info { padding: 9px 11px 10px; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.asset .info b { font-size: 12px; font-weight: 500; }
.asset .info span { font-family: var(--mono); font-size: 10px; color: var(--dim); }
.asset .row { display: flex; gap: 6px; margin-top: auto; padding-top: 7px; }
.asset .row button { font-family: var(--mono); font-size: 10px; color: var(--dim); border: 1px solid var(--line); border-radius: 2px; padding: 2px 7px; }
.asset .row button:hover { color: var(--ink); border-color: var(--dim); }

/* ── 配置（可写）── */
.cfg-group { margin-bottom: 20px; }
.cfg-group > h3 { font-size: 13px; font-weight: 600; margin: 0 0 2px; display: flex; align-items: center; gap: 9px; }
.cfg-group > .gp { font-size: 11.5px; color: var(--dim); margin: 0 0 9px; }
.cfg { border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--panel); }
.cfg-group.danger .cfg { border-color: rgba(244,121,106,.35); }
.cfg-row {
  display: grid; grid-template-columns: 158px minmax(0, 1fr) 190px; gap: 16px;
  padding: 11px 15px; border-bottom: 1px solid var(--line-2); align-items: center;
}
.cfg-row:last-child { border-bottom: none; }
.cfg-row.dirty { background: rgba(61,220,151,.05); }
.cfg-row.dirty .k::after { content: "●"; color: var(--acc); font-size: 8px; margin-left: 6px; vertical-align: 2px; }
.cfg-row .k { font-size: 12.5px; font-weight: 500; }
.cfg-row .k em { font-style: normal; display: block; font-family: var(--mono); font-size: 10px; color: var(--dim); margin-top: 1px; }
.cfg-row .ctl { min-width: 0; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.cfg-row .side { font-family: var(--mono); font-size: 10.5px; color: var(--dim); text-align: right; line-height: 1.5; }
.cfg-row .side .was { color: var(--acc); }

.cfg select, .cfg input[type="text"], .cfg input[type="number"] {
  font-family: var(--mono); font-size: 12px;
  background: var(--panel-2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px;
  min-width: 0; max-width: 100%;
}
.cfg select:hover, .cfg input:hover { border-color: var(--dim); }
.cfg input[type="text"] { width: 100%; }
.cfg input[type="number"] { width: 72px; }
.cfg input[type="range"] { accent-color: var(--acc); width: 148px; max-width: 100%; }
.cfg .unit { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
.cfg .val { font-family: var(--mono); font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 44px; }

.sw { display: inline-flex; align-items: center; gap: 8px; }
.sw .track { width: 34px; height: 18px; border-radius: 10px; background: var(--line); border: 1px solid var(--line); position: relative; flex: none; transition: background .12s; }
.sw .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--dim); transition: transform .12s, background .12s; }
.sw[aria-pressed="true"] .track { background: rgba(61,220,151,.28); border-color: var(--acc); }
.sw[aria-pressed="true"] .track::after { transform: translateX(16px); background: var(--acc); }
.sw .t { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
.sw[aria-pressed="true"] .t { color: var(--acc); }

.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chips button {
  font-family: var(--mono); font-size: 11px; padding: 2px 8px;
  border: 1px solid var(--line); border-radius: 2px; color: var(--dim);
}
.chips button:hover { border-color: var(--dim); color: var(--ink-2); }
.chips button[aria-pressed="true"] { background: rgba(77,140,255,.14); border-color: rgba(77,140,255,.5); color: var(--acc-2); }

/* 待保存条：改动先攒着，一次提交，避免误触 */
.savebar {
  position: sticky; bottom: 0; z-index: 30; margin-top: 18px;
  background: var(--panel-2); border: 1px solid var(--acc); border-radius: 4px;
  padding: 11px 15px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  box-shadow: 0 -6px 22px rgba(0,0,0,.45);
}
.savebar .n { font-size: 12.5px; font-weight: 600; }
.savebar .d { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.savebar .acts { margin-left: auto; display: flex; gap: 8px; }

.confirm { border: 1px solid rgba(244,121,106,.5); border-left: 3px solid var(--bad); background: rgba(244,121,106,.07); border-radius: 4px; padding: 12px 15px; margin-top: 10px; }
.confirm .t { font-weight: 600; font-size: 13px; }
.confirm .d { font-size: 12px; color: var(--ink-2); margin-top: 3px; line-height: 1.6; }
.confirm .acts { display: flex; gap: 8px; margin-top: 10px; }

/* ── 设计注记：明确标成注记，可关闭，不占黄金位置 ── */
.memo {
  border: 1px dashed var(--line); border-radius: 3px;
  background: rgba(255,255,255,.015);
  padding: 9px 13px; font-size: 12px; color: var(--dim);
  margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start;
}
.memo b { color: var(--ink-2); font-weight: 600; }
.memo .lab { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--acc); flex: none; padding-top: 2px; }
.memo .close { margin-left: auto; color: var(--dim); font-family: var(--mono); font-size: 13px; line-height: 1; padding: 0 2px; flex: none; }
.memo .close:hover { color: var(--ink); }

.protobar {
  position: fixed; right: 12px; bottom: 12px; z-index: 50;
  font-family: var(--mono); font-size: 10px; color: var(--dim);
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 3px; padding: 4px 9px;
}

/* ── 响应式：720 才折叠，导航横向滚动不换行 ── */
@media (max-width: 720px) {
  .shell { grid-template-columns: 1fr; }
  .nav {
    position: sticky; top: 0; z-index: 20; height: auto;
    flex-direction: row; align-items: center; gap: 2px;
    padding: 9px 12px; overflow-x: auto;
    border-right: none; border-bottom: 1px solid var(--line);
  }

    side: "脚本生成时的软约束" },
  { g: "next", k: "每次产出", env: "XHS_VIDEO_TOPICS_PER_RUN", type: "number", val: 3, min: 1, max: 10,
    unit: "条", side: "一次流水线跑几支片" },
  { g: "next", k: "分辨率", env: "XHS_VIDEO_RENDER_RESOLUTION", type: "select", val: "1080x1920",
    opts: [["1080x1920", "1080×1920 竖版"], ["1920x1080", "1920×1080 横版"], ["1080x1080", "1080×1080 方形"]],
    side: "" },
  { g: "next", k: "帧率", env: "XHS_VIDEO_RENDER_FPS", type: "number", val: 30, min: 24, max: 60, unit: "fps",
    side: "2:36 @30fps = 4680 帧" },
  { g: "next", k: "背景音乐", env: "XHS_VIDEO_BGM_ENABLED", type: "switch", val: true,
    side: "曲库 62 首 · 6 种情绪" },

  // ── 立刻生效 ──
  { g: "now", k: "采集平台", env: "XHS_VIDEO_TREND_PLATFORMS", type: "chips",
    val: ["bilibili", "v2ex", "toutiao", "baidu", "wechat", "zhihu", "weibo", "xiaohongshu", "douyin", "twitter"],
    opts: ["bilibili", "v2ex", "toutiao", "baidu", "wechat", "zhihu", "weibo", "xiaohongshu", "douyin", "twitter", "juejin", "36kr", "web"],
    side: "共 13 个可选" },
  { g: "now", k: "采集关键词", env: "XHS_VIDEO_TREND_KEYWORDS", type: "text",
    val: "AI,人工智能,大模型,AI工具,效率,自动化", side: "逗号分隔" },
  { g: "now", k: "每平台条数", env: "XHS_VIDEO_TRENDS_PER_PLATFORM", type: "number", val: 20, min: 5, max: 50,
    unit: "条", side: "平台 × 关键词 = 请求数" },
  { g: "now", k: "带上平台热榜", env: "XHS_VIDEO_TREND_INCLUDE_HOT", type: "switch", val: false,
    side: "定向调研时应关闭" },
  { g: "now", k: "每日触发", env: "XHS_VIDEO_DAILY_TRIGGER_HOUR", type: "number", val: 0, min: 0, max: 23,
    unit: "时 UTC", side: "0 = 北京 08:00" },

  // ── 危险区 ──
  { g: "risk", k: "小红书发布模式", env: "XHS_VIDEO_XHS_PUBLISH_MODE", type: "select", val: "draft",
    opts: [["draft", "draft · 存草稿"], ["publish", "publish · 直接发布"]],
    danger: { on: "publish", title: "切到 publish 之后，通过发布审批的内容会真的发到小红书",
      body: "当前是 draft：只写进浏览器本地草稿箱，你还能在小红书 App 里检查一遍再发。切到 publish 后这一步消失。" },
    side: "当前：不会真的发出去" },
  { g: "risk", k: "自动流水线", env: "XHS_VIDEO_PIPELINE_ENABLED", type: "switch", val: false,
    danger: { on: true, title: "打开后，每日定时会自动跑完整条流水线",
      body: "包含采集、调 Claude API 生成脚本、下载素材、渲染。发布仍受发布模式和审批约束，但前面几步会自动消耗 API 额度和磁盘。" },

];

/* ════════ 渲染 ════════ */

const main = document.getElementById("main");
const nav = document.getElementById("nav");
let view = "tasks", taskId = null;
let taskFilter = "all", sigPlatform = "all", sigSort = "heat";
const memoClosed = new Set();

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function head(title, sub, acts = "") {
  return `<div class="head"><div><h1>${title}</h1><div class="sub">${sub}</div></div>
    ${acts ? `<div class="acts">${acts}</div>` : ""}</div>`;
}
function memo(id, html) {
  if (memoClosed.has(id)) return "";
  return `<div class="memo"><span class="lab">设计注记</span><div>${html}</div>
    <button class="close" data-memo="${id}" aria-label="收起注记">×</button></div>`;
}
function seg(label, name, opts, cur) {
  return `<div class="seg"><span class="lbl">${label}</span><div class="opts">${opts
    .map(([k, l]) => `<button data-${name}="${k}" aria-pressed="${cur === k}">${l}</button>`).join("")}</div></div>`;
}

/* ── 任务台 ── */
function viewTasks() {
  const counts = {};
  BUCKETS.forEach(([k]) => counts[k] = TASKS.filter((t) => t.bucket === k).length);
  const opts = [["all", `全部 ${TASKS.length}`], ...BUCKETS.map(([k, l]) => [k, `${l} ${counts[k]}`])];

  const list = TASKS.filter((t) => taskFilter === "all" || t.bucket === taskFilter);
  let html = "", lastBucket = null;
  const order = ["act", "err", "run", "done"];
  list.sort((a, b) => order.indexOf(a.bucket) - order.indexOf(b.bucket));

  list.forEach((t) => {
    if (taskFilter === "all" && t.bucket !== lastBucket) {
      lastBucket = t.bucket;
      const label = BUCKETS.find(([k]) => k === t.bucket)[1];
      html += `<tr class="groupdiv"><td colspan="5">${label} · ${counts[t.bucket]}</td></tr>`;
    }
    html += `<tr class="clickable ${t.bucket === "act" ? "act" : t.bucket === "err" ? "err" : ""}"
      data-task="${t.id}" tabindex="0" role="link">
      <td><span class="ttl">${esc(t.title)}</span><span class="meta">${t.id}</span></td>
      <td><span class="tag ${t.format === "video" ? "vid" : "art"}">${t.format === "video" ? "视频" : "图文"}</span></td>
      <td><span class="tag ${t.tone}">${t.stateLabel}</span></td>
      <td class="mono">${esc(t.out)}</td>
      <td class="mono">${esc(t.updated)}</td>
    </tr>`;
  });

  return head("任务台", `待我处理 ${counts.act} · 出错 ${counts.err} · 进行中 ${counts.run}`,
      `<button class="btn">新建任务</button>`) +
    memo("tasks", `图文和视频在同一张表里，用形态标签区分——<b>不给视频单独的顶级入口</b>。
      行首色条标出需要你动手的任务：琥珀＝等你审批，红＝出错。`) +
    `<div class="bar">${seg("筛选", "tf", opts, taskFilter)}<span class="spacer"></span>
      <span class="count">${list.length} 条</span></div>
     <div class="tablewrap"><table>
       <thead><tr><th style="width:42%">任务</th><th>形态</th><th>状态</th><th>产出</th><th>更新</th></tr></thead>
       <tbody>${html}</tbody></table></div>`;
}

/* ── 任务详情 ── */
function viewTask(id) {
  const idx = TASKS.findIndex((x) => x.id === id);
  const t = TASKS[idx];
  if (!t) return viewTasks();
  const prev = TASKS[idx - 1], next = TASKS[idx + 1];

  const banner = t.error ? `<div class="banner">
      <div><div class="t">${esc(t.error.title)}</div>
        <div class="d">${esc(t.error.detail)}</div>
        <div class="fix">${esc(t.error.fix)}</div></div>
      <div class="acts">${t.error.actions
        .map(([l, c]) => `<button class="btn ${c}">${l}</button>`).join("")}</div>
    </div>` : "";

  let checkHtml = "";
  if (t.check) {
    const c = t.check;
    checkHtml = `<div class="check">
      <div><span class="k">脚本声明</span><span class="v">${c.script}</span></div>
      <div><span class="k">语音实际</span><span class="v">${c.speech}</span></div>
      <div><span class="k">组合时间轴</span><span class="v">${c.comp}</span></div>
      <div><span class="k">成片</span><span class="v${c.final === "—" ? " na" : ""}">${c.final}</span></div>
      <div><span class="k">最大漂移</span><span class="v ${c.pass ? "good" : "na"}">${c.drift}${c.pass ? " ✓" : ""}</span></div>
    </div>`;
  }

  const steps = t.steps.map((s) => {
    const sub = s.sub ? `<div class="sub">
        <div class="sub-h"><span>视频子流水线 · 6 阶段</span><span>run ${t.id.replace("t_", "r_")}</span></div>
        ${s.sub.map(([en, d, time, failed]) =>
          `<div class="sub-row${failed ? " failed" : ""}"><span class="en">${en}</span>
           <span class="d">${d}</span><span class="t">${time}</span></div>`).join("")}
      </div>` : "";
    const acts = s.actions ? `<div class="step-actions">${s.actions
      .map(([l, c]) => `<button class="btn ${c}">${l}</button>`).join("")}</div>` : "";
    return `<li>
      <div class="rail"><div class="node ${s.node || ""}"></div></div>
      <div class="step">
        <div class="step-h"><b>${s.name}</b><span class="tag ${s.tone}">${s.tag}</span>
          ${s.when ? `<span class="when">${s.when}</span>` : ""}</div>
        ${s.desc ? `<div class="step-d">${s.desc}</div>` : ""}
        ${sub}${acts}
      </div></li>`;
  }).join("");

  const pager = `<div class="acts">
      <button class="btn" data-task-nav="${prev ? prev.id : ""}" ${prev ? "" : "disabled"}>← 上一条</button>
      <button class="btn" data-task-nav="${next ? next.id : ""}" ${next ? "" : "disabled"}>下一条 →</button>
    </div>`;

  return `<button class="back" data-view="tasks">← 任务台</button>` +
    head(esc(t.title),
      `${t.id} · ${t.format === "video" ? "视频" : "图文"} · ${t.stateLabel} · ${esc(t.account)}`, pager) +
    banner + checkHtml + `<ol class="trunk">${steps}</ol>`;
}

/* ── 采集 ── */
function viewSignals() {
  const plats = [["all", "全部"], ...Object.entries(PLATFORM_CN).map(([k, v]) => [k, v])];
  let list = SIGNALS.filter((s) => sigPlatform === "all" || s.p === sigPlatform);
  list = [...list].sort((a, b) => sigSort === "heat"
    ? b.mv - a.mv
    : (a.age === null ? 1 : b.age === null ? -1 : a.age - b.age));

  const rows = list.map((s) => {
    const stale = s.age !== null && s.age >= 90;
    const when = s.date
      ? `${s.date} <span style="color:${stale ? "var(--warn)" : "var(--dim)"}">· ${s.age} 天前</span>`
      : `<span style="color:var(--dim)">未提供</span>`;
    return `<tr>
      <td><span class="ttl">${esc(s.t)}</span><span class="meta">${esc(s.a)}</span></td>
      <td><span class="tag ${s.via === "站内" ? "vid" : "off"}">${PLATFORM_CN[s.p]}</span></td>
      <td class="mono">${s.m}</td>
      <td class="mono">${when}</td>
      <td class="mono">${s.via}</td>
    </tr>`;
  }).join("");

  return head("采集信号", `run r_9f2c · 5 平台 · 共 ${SIGNALS.length} 条`) +
    memo("signals", `切到<b>按发布时间</b>排一次就能看出问题：点赞第二高的那条发布于
      <b>434 天前</b>。热度分只看互动量、不看时效，去年的话题会稳稳排在榜首。<br>
      「互动」列按平台各自的指标显示——B站是播放、V2EX 是回复，压成同一个"点赞"列会让多数行变成空值。`) +
    `<div class="bar">${seg("平台", "plat", plats, sigPlatform)}
      ${seg("排序", "sort", [["heat", "热度"], ["date", "发布时间"]], sigSort)}
      <span class="spacer"></span><span class="count">${list.length} / ${SIGNALS.length} 条</span></div>
     <div class="tablewrap"><table>
       <thead><tr><th style="width:44%">标题</th><th>平台</th><th>互动</th><th>发布</th><th>通道</th></tr></thead>
       <tbody>${rows}</tbody></table></div>`;
}

/* ── 资产 ── */
function viewAssets() {
  const n = ASSET_GROUPS.reduce((a, g) => a + g.items.length, 0);
  const groups = ASSET_GROUPS.map((g) => `
    <section class="agroup">
      <h3>${esc(g.task)} <span class="tag ${g.tone}">${g.label}</span></h3>
      <p class="p">${g.id} · ${g.path}</p>
      <div class="assets">${g.items.map((a) => `
        <article class="asset">
          <div class="frame"><div class="shot ${a.r}">
            <span class="kind">${esc(a.k)}</span>
          </div></div>
          <div class="info"><b>${esc(a.t)}</b><span>${esc(a.x)}</span>
            <div class="row"><button>打开</button><button>Finder</button><button>复制路径</button></div>
          </div>
        </article>`).join("")}</div>
    </section>`).join("");

  return head("资产", `${ASSET_GROUPS.length} 个任务 · ${n} 个产物`) +
    memo("assets", `按任务分组，一个任务的成片、封面、旁白在一起——
      存在意义就是<b>不用再 cd 到两层 uuid 目录</b>去找文件。
      所有卡片共用同一个取景框，内部按真实比例摆放，所以竖版和横版排在一起也不会参差。`) +
    groups;
}

/* ── 工具 ── */
function viewTools() {
  const n = { ok: 0, wait: 0, bad: 0 };
  TOOLS.forEach((t) => n[t.tone]++);
  const rows = TOOLS.map((t) => `
    <div class="tool ${t.tone}">
      <div class="n">${esc(t.n)} <span class="tag ${t.tone}">${t.s}</span></div>
      <div class="body"><span class="x">${t.x}</span>${t.fix ? `<span class="fix">${t.fix}</span>` : ""}</div>
      <div class="go">${t.go ? `<button class="btn">${t.go}</button>` : ""}</div>
    </div>`).join("");

  return head("工具体检", `${TOOLS.length} 项 · 不可用 ${n.bad} · 降级 ${n.wait} · 正常 ${n.ok}`,
      `<button class="btn" id="recheck">重新体检</button>`) +
    memo("tools", `按<b>严重度</b>排序，不可用的排最上面——这一页存在的唯一意义，
      就是让需要你动手的东西第一眼被看到。状态色（正常 / 降级 / 不可用）与品牌绿是两套色。`) +
    `<div class="tools">${rows}</div>`;
}

/* ── 配置（可写）── */
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const cfgDraft = {};   // env -> 待保存值
let cfgPending = null; // 待确认的危险改动

function cfgVal(f) { return f.env in cfgDraft ? cfgDraft[f.env] : f.val; }
function cfgDirty() { return CFG_FIELDS.filter((f) => f.env in cfgDraft && !same(cfgDraft[f.env], f.val)); }

function showVal(f, v) {
  if (f.type === "switch") return v ? "开" : "关";
  if (f.type === "range") return f.fmt(v);
  if (f.type === "range2") return `${v[0]}–${v[1]}s`;
  if (f.type === "chips") return `${v.length} 个`;
  return String(v);
}

function control(f) {
  const v = cfgVal(f), e = f.env;
  switch (f.type) {
    case "select":
      return `<select data-cfg="${e}">${f.opts
        .map(([k, l]) => `<option value="${k}"${k === v ? " selected" : ""}>${l}</option>`).join("")}</select>`;
    case "switch":
      return `<button class="sw" data-cfg="${e}" data-toggle="1" aria-pressed="${v}">
        <span class="track"></span><span class="t">${v ? "开" : "关"}</span></button>`;
    case "range":
      return `<input type="range" data-cfg="${e}" min="${f.min}" max="${f.max}" step="${f.step}" value="${v}">
        <span class="val">${f.fmt(v)}</span>`;
    case "range2":
      return `<input type="number" data-cfg="${e}" data-part="0" min="${f.min}" max="${f.max}" step="${f.step}" value="${v[0]}">
        <span class="unit">–</span>
        <input type="number" data-cfg="${e}" data-part="1" min="${f.min}" max="${f.max}" step="${f.step}" value="${v[1]}">
        <span class="unit">秒</span>`;
    case "number":
      return `<input type="number" data-cfg="${e}" min="${f.min}" max="${f.max}" value="${v}">
        ${f.unit ? `<span class="unit">${f.unit}</span>` : ""}`;
    case "text":
      return `<input type="text" data-cfg="${e}" value="${esc(v)}">`;
    case "chips":
      return `<div class="chips">${f.opts.map((o) =>
        `<button data-cfg="${e}" data-chip="${o}" aria-pressed="${v.includes(o)}">${o}</button>`).join("")}</div>`;
  }
  return "";
}

function viewConfig() {
  const dirty = cfgDirty();
  const dirtyEnv = new Set(dirty.map((f) => f.env));

  const groups = CFG_GROUPS.map((g) => {
    const rows = CFG_FIELDS.filter((f) => f.g === g.id).map((f) => {
      const changed = dirtyEnv.has(f.env);
      const side = changed
        ? `<span class="was">${showVal(f, f.val)} → ${showVal(f, cfgVal(f))}</span>`
        : esc(f.side || "");
      return `<div class="cfg-row${changed ? " dirty" : ""}">
        <div class="k">${esc(f.k)}<em>${esc(f.env)}</em></div>
        <div class="ctl">${control(f)}</div>
        <div class="side">${side}</div>
      </div>`;
    }).join("");
    // 确认块紧跟在被改的那一项下面，而不是丢到页面顶部——
    // 否则你在页尾扳了开关，确认框出现在你看不见的地方
    const ask = cfgPending && cfgPending.f.g === g.id ? `<div class="confirm">
        <div class="t">${esc(cfgPending.d.title)}</div>
        <div class="d">${esc(cfgPending.d.body)}</div>
        <div class="acts">
          <button class="btn danger" data-cfg-confirm="1">我确认，改成 ${showVal(cfgPending.f, cfgPending.v)}</button>
          <button class="btn" data-cfg-cancel="1">取消</button>
        </div></div>` : "";

    return `<section class="cfg-group${g.danger ? " danger" : ""}">
      <h3>${g.title}${g.danger ? ' <span class="tag bad">需二次确认</span>' : ""}</h3>
      <p class="gp">${g.desc}</p>
      <div class="cfg">${rows}</div>
      ${ask}
    </section>`;
  }).join("");

  const confirm = "";

  const bar = dirty.length ? `<div class="savebar">
      <div><div class="n">${dirty.length} 项改动待保存</div>
        <div class="d">${dirty.map((f) => f.k).join(" · ")}</div></div>
      <div class="acts">
        <button class="btn" data-cfg-discard="1">放弃</button>
        <button class="btn primary" data-cfg-save="1">写入 .env</button>
      </div></div>` : "";

  return head("配置", "来自 .env 与 video_pipeline/config.py · 可写",
      `<button class="btn">查看运行快照</button>`) +
    memo("config", `改动<b>不会影响已经跑过的运行</b>——每次运行启动时都会
      <code>_snapshot_config()</code> 存一份当时的配置，历史运行按各自的快照回溯。
      所以这一页可以放心改。危险项单独分区并要求二次确认。`) +
    confirm + groups + bar;
}

/* ── 路由 ── */
const VIEWS = { tasks: viewTasks, signals: viewSignals, assets: viewAssets, tools: viewTools, config: viewConfig };

function render() {
  main.innerHTML = view === "task" ? viewTask(taskId) : VIEWS[view]();
  nav.querySelectorAll("button[data-view]").forEach((b) => {
    const on = b.dataset.view === view || (view === "task" && b.dataset.view === "tasks");
    b.setAttribute("aria-current", on ? "page" : "false");
  });
  window.scrollTo(0, 0);
}
function go(next, id) { view = next; taskId = id ?? null; render(); }

nav.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-view]");
  if (b) go(b.dataset.view);
});

main.addEventListener("click", (e) => {
  const m = e.target.closest("[data-memo]");
  if (m) { memoClosed.add(m.dataset.memo); return render(); }

  const tn = e.target.closest("[data-task-nav]");
  if (tn && tn.dataset.taskNav) return go("task", tn.dataset.taskNav);

  const back = e.target.closest("[data-view]");
  if (back) return go(back.dataset.view);

  const row = e.target.closest("[data-task]");
  if (row) return go("task", row.dataset.task);

  const tf = e.target.closest("[data-tf]");
  if (tf) { taskFilter = tf.dataset.tf; return render(); }

  const plat = e.target.closest("[data-plat]");
  if (plat) { sigPlatform = plat.dataset.plat; return render(); }

  const sort = e.target.closest("[data-sort]");
  if (sort) { sigSort = sort.dataset.sort; return render(); }

  if (e.target.id === "recheck") {
    e.target.textContent = "体检中…"; e.target.disabled = true;
    setTimeout(render, 700);
    return;
  }

  /* ── 配置页 ── */
  if (e.target.closest("[data-cfg-discard]")) {
    Object.keys(cfgDraft).forEach((k) => delete cfgDraft[k]);
    cfgPending = null; return render();
  }
  if (e.target.closest("[data-cfg-save]")) {
    cfgDirty().forEach((f) => { f.val = cfgDraft[f.env]; });
    Object.keys(cfgDraft).forEach((k) => delete cfgDraft[k]);
    return render();
  }
  if (e.target.closest("[data-cfg-cancel]")) { cfgPending = null; return render(); }
  if (e.target.closest("[data-cfg-confirm]")) {
    cfgDraft[cfgPending.f.env] = cfgPending.v; cfgPending = null; return render();
  }

  const chip = e.target.closest("[data-chip]");
  if (chip) {
    const f = CFG_FIELDS.find((x) => x.env === chip.dataset.cfg);
    const cur = [...cfgVal(f)], o = chip.dataset.chip;
    const i = cur.indexOf(o);
    i === -1 ? cur.push(o) : cur.splice(i, 1);
    cfgDraft[f.env] = cur; return render();
  }

  const tog = e.target.closest("[data-toggle]");
  if (tog) {
    const f = CFG_FIELDS.find((x) => x.env === tog.dataset.cfg);
    const next = !cfgVal(f);
    if (f.danger && next === f.danger.on) { cfgPending = { f, v: next, d: f.danger }; return render(); }
    cfgDraft[f.env] = next; return render();
  }
});

/* 配置控件的值变化 */
main.addEventListener("input", (e) => {
  const el = e.target.closest("[data-cfg]");
  if (!el || el.dataset.toggle || el.dataset.chip) return;
  const f = CFG_FIELDS.find((x) => x.env === el.dataset.cfg);
  if (!f) return;

  if (f.type === "range2") {
    const cur = [...cfgVal(f)];
    cur[+el.dataset.part] = +el.value;
    if (cur[0] >= cur[1]) return;          // 最短不能大于等于最长
    cfgDraft[f.env] = cur;
    return render();
  }

  let v = el.type === "number" || f.type === "range" ? +el.value : el.value;
  if (f.danger && v === f.danger.on) { cfgPending = { f, v, d: f.danger }; el.value = f.val; return render(); }

  cfgDraft[f.env] = v;
  if (f.type === "range") {                // 拖动时只更新数字，不整页重渲，否则滑块会掉焦
    const lab = el.parentElement.querySelector(".val");
    if (lab) lab.textContent = f.fmt(v);
    return;
  }
  render();
});

/* 滑块松手后再整页重渲，把「旧 → 新」和待保存条刷出来 */
main.addEventListener("change", (e) => {
  const el = e.target.closest('input[type="range"][data-cfg]');
  if (el) render();
});

main.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest("[data-task]");
  if (row) { e.preventDefault(); go("task", row.dataset.task); }
});

/* j / k 在任务详情之间跳，处理待办时不用回列表 */
document.addEventListener("keydown", (e) => {
  if (view !== "task" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  const i = TASKS.findIndex((x) => x.id === taskId);
  if (e.key === "j" && TASKS[i + 1]) go("task", TASKS[i + 1].id);
  if (e.key === "k" && TASKS[i - 1]) go("task", TASKS[i - 1].id);
  if (e.key === "Escape") go("tasks");
});

render();
</script>
