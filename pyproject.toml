[project]
name = "xhs-manager"
version = "0.1.0"
description = "AI 技术科普小红书自动运营系统"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.13,<2",
    "beautifulsoup4>=4.12,<5",
    "edge-tts>=7.2.8",
    "fastapi>=0.115,<1",
    "httpx>=0.28.1",
    "librosa>=0.11.0",
    "opencv-python-headless>=5.0.0.93",
    "playwright>=1.60.0",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xhs_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
