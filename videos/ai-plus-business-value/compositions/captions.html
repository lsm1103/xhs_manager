<template id="captions-template" data-composition-id="captions" data-width="1080" data-height="1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>


<style data-brand-tokens>
      @font-face {
        font-family: "Barlow";
        src: local("PingFang SC"), local("Arial");
        font-style: normal;
        font-weight: 100 900;
      }
      :root {
      --ink-black: #111111;
      --ink-black-alt: #1A1A18;
      --fire-orange: #E85D26;
      --cream: #F0ECE5;
      --cream-muted: #888880;
      --cream-hint: #505048;
      --border-dark: #282826;
      --ink-on-orange-muted: rgba(17,17,17,0.75);
      --ink-on-orange-hint: rgba(17,17,17,0.55);
      --ink-on-orange-faint: rgba(17,17,17,0.40);
      --ink-on-orange-border: rgba(17,17,17,0.20);
      --cap-ink: #111111;
      --cap-canvas: #F0ECE5;
      --cap-accent: #E85D26;
      --cap-accent-2: #888880;
      --font-display: "Barlow", system-ui, serif;
      --font-body: "Barlow", system-ui, sans-serif;
      --cap-band-top: 1600px;
      --cap-band-height: 320px;
      }
    </style>

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE ink-black plate — single 1px fire-orange hairline (broadside's lone accent),
     SHARP corners (0 radius), NO shadow (the plane is flat) */
  .caption-pill {
    max-width: 80%;
    padding: 18px 44px 22px;
    background: var(--cap-ink, #111111);
    border: 1px solid var(--cap-accent, #e85d26);
    border-radius: 0;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.04em 0.3em;
    font-family: "Barlow", system-ui, sans-serif;
    font-weight: 900;
    font-size: clamp(38px, 4.2vw, 56px);
    line-height: 1.02;
    letter-spacing: -0.03em;
    text-transform: lowercase;
  }

  /* upcoming — faint cream, no block (massive lowercase Barlow 900 as graphic primitive) */
  .caption-word {
    display: inline-block;
    padding: 0 0.08em;
    color: color-mix(in srgb, var(--cap-canvas, #f0ece5) 42%, var(--cap-ink, #111111));
  }
  /* current word — THE register flip: a hard flat fire-orange block (box-shadow spread =
     a sharp rectangle w/o layout shift; no blur), ink reading on top — the lone accent */
  .caption-word.is-active {
    color: var(--cap-ink, #111111);
    background: var(--cap-accent, #e85d26);
    box-shadow: 0 0 0 0.06em var(--cap-accent, #e85d26);
  }
  /* already spoken — solid cream, the orange block cleared */
  .caption-word.is-spoken {
    color: var(--cap-canvas, #f0ece5);
    background: transparent;
    box-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — fire-orange ink, the cream-on-ink register's only inflection */
  .caption-word.cap-brand {
    color: var(--cap-accent, #e85d26);
  }
  /* numerals / data — the IBM Plex Mono chrome voice, uppercase + tracked, recessed */
  .caption-word.cap-num {
    font-family: "Barlow", ui-monospace, monospace;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: color-mix(in srgb, var(--cap-canvas, #f0ece5) 72%, var(--cap-ink, #111111));
  }
  /* emphasis — a fire-orange hairline underline (no second hue; the lone accent again) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-decoration-color: var(--cap-accent-2, #e85d26);
    text-underline-offset: 0.1em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(32px, 5.2vw, 46px);
    }
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="68"
  data-fps="30"
  data-width="1080"
  data-height="1920"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // captions.mjs injects the engine's scene-aware groups + real duration here.
  var GROUPS = [{"id":"caption-group-0","frame":1,"start":0.1,"end":6.97,"text":"你看到的 AI 演示 也许很厉害 但客户愿不愿为结果持续付费 是另一回事","words":[{"id":"caption-word-0-0","text":"你看到的 AI 演示","start":0.1,"end":1.8},{"id":"caption-word-0-1","text":"也许很厉害","start":1.85,"end":3},{"id":"caption-word-0-2","text":"但客户愿不愿为结果持续付费","start":3.05,"end":5.8},{"id":"caption-word-0-3","text":"是另一回事","start":5.85,"end":6.85}]},{"id":"caption-group-1","frame":2,"start":7.1,"end":14.72,"text":"真正的商业价值 不在 AI 加号 而在它能不能进入工作流 稳定交付一个可计量的结果","words":[{"id":"caption-word-1-0","text":"真正的商业价值","start":7.1,"end":8.7},{"id":"caption-word-1-1","text":"不在 AI 加号","start":8.75,"end":10},{"id":"caption-word-1-2","text":"而在它能不能进入工作流","start":10.05,"end":12.3},{"id":"caption-word-1-3","text":"稳定交付一个可计量的结果","start":12.35,"end":14.6}]},{"id":"caption-group-2","frame":3,"start":16.1,"end":22.25,"text":"判断一个 AI 项目 先过四道闸门 问题是否高频 能否嵌入现有流程","words":[{"id":"caption-word-2-0","text":"判断一个 AI 项目","start":16.1,"end":17.7},{"id":"caption-word-2-1","text":"先过四道闸门","start":17.75,"end":19},{"id":"caption-word-2-2","text":"问题是否高频","start":19.05,"end":20.5},{"id":"caption-word-2-3","text":"能否嵌入现有流程","start":20.55,"end":22.2}]},{"id":"caption-group-3","frame":3,"start":22.25,"end":26.82,"text":"出错后谁负责 第二个客户能不能复用","words":[{"id":"caption-word-3-0","text":"出错后谁负责","start":22.25,"end":23.7},{"id":"caption-word-3-1","text":"第二个客户能不能复用","start":23.75,"end":26.7}]},{"id":"caption-group-4","frame":4,"start":28.1,"end":34.25,"text":"还要分清四个人 谁使用 谁受益 谁采购 谁担责 只问其中一个","words":[{"id":"caption-word-4-0","text":"还要分清四个人","start":28.1,"end":29.6},{"id":"caption-word-4-1","text":"谁使用 谁受益","start":29.65,"end":31.1},{"id":"caption-word-4-2","text":"谁采购 谁担责","start":31.15,"end":32.7},{"id":"caption-word-4-3","text":"只问其中一个","start":32.75,"end":34.2}]},{"id":"caption-group-5","frame":4,"start":34.25,"end":36.87,"text":"项目判断一定会失真","words":[{"id":"caption-word-5-0","text":"项目判断一定会失真","start":34.25,"end":36.75}]},{"id":"caption-group-6","frame":5,"start":37.1,"end":44.75,"text":"别再只看调用量 该算一次业务结果的价值 减去模型 审核 集成 错误和持续运维","words":[{"id":"caption-word-6-0","text":"别再只看调用量","start":37.1,"end":38.6},{"id":"caption-word-6-1","text":"该算一次业务结果的价值","start":38.65,"end":40.7},{"id":"caption-word-6-2","text":"减去模型 审核 集成","start":40.75,"end":42.8},{"id":"caption-word-6-3","text":"错误和持续运维","start":42.85,"end":44.7}]},{"id":"caption-group-7","frame":5,"start":44.75,"end":47.32,"text":"最后还剩多少","words":[{"id":"caption-word-7-0","text":"最后还剩多少","start":44.75,"end":47.2}]},{"id":"caption-group-8","frame":6,"start":48.1,"end":54.65,"text":"公开讨论的措辞不同 B站谈数据和流程 微博谈结果与交易 X 更强调治理和回滚","words":[{"id":"caption-word-8-0","text":"公开讨论的措辞不同","start":48.1,"end":49.7},{"id":"caption-word-8-1","text":"B站谈数据和流程","start":49.75,"end":51.2},{"id":"caption-word-8-2","text":"微博谈结果与交易","start":51.25,"end":52.7},{"id":"caption-word-8-3","text":"X 更强调治理和回滚","start":52.75,"end":54.6}]},{"id":"caption-group-9","frame":6,"start":54.65,"end":57.82,"text":"都在把 AI 拉回真实业务","words":[{"id":"caption-word-9-0","text":"都在把 AI 拉回真实业务","start":54.65,"end":57.7}]},{"id":"caption-group-10","frame":7,"start":58.1,"end":65.25,"text":"别从万能 AI 产品开始 先选一个高频 可计量 而且能回滚的结果 把它跑通","words":[{"id":"caption-word-10-0","text":"别从万能 AI 产品开始","start":58.1,"end":60.2},{"id":"caption-word-10-1","text":"先选一个高频 可计量","start":60.25,"end":62.3},{"id":"caption-word-10-2","text":"而且能回滚的结果","start":62.35,"end":64.2},{"id":"caption-word-10-3","text":"把它跑通","start":64.25,"end":65.2}]},{"id":"caption-group-11","frame":7,"start":65.25,"end":67.87,"text":"再谈 AI 加什么","words":[{"id":"caption-word-11-0","text":"再谈 AI 加什么","start":65.25,"end":67.75}]}];
  var DURATION = 68;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        tl.fromTo(el, { scale: 0.92 }, { scale: 1, duration: 0.1, ease: "power3.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>

<style>
  .caption-line { line-height: 1.1 !important; }
</style>
</template>
