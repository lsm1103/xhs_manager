          lightAt: 2.18,
          fromX: 300,
          tiltFrom: -22,
          tiltTo: -12

      const xhsPanel = xhs.querySelector("[data-f06-panel]");
      const gapStamp = document.getElementById("06-platforms-gap-stamp");
      const hero = document.getElementById("06-platforms-hero");
      const pusher = document.getElementById("06-platforms-pusher");
      const seed = document.getElementById("06-platforms-seed");
      const branchIds = [
        "06-platforms-branch-bilibili",
        "06-platforms-branch-weibo",
        "06-platforms-branch-x"
      ];
      const branches = branchIds.map((id) => document.getElementById(id));
      const trunk = document.getElementById("06-platforms-trunk");

      [...branches, trunk].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
      });

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        seed,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.34, ease: "power3.out" },
        0.08
      );

      columns.forEach((item) => {
        const panel = item.root.querySelector("[data-f06-panel]");
        const words = item.root.querySelectorAll("[data-f06-words] span");
        const accent = item.root.querySelector("[data-f06-accent]");

        tl.fromTo(
          item.root,
          { x: item.fromX, scale: 0.86, opacity: 0 },
          { x: 0, scale: 1, opacity: 1, duration: 0.74, ease: "power3.out" },
          item.at
        );
        tl.fromTo(
          panel,
          { rotateY: item.tiltFrom },
          { rotateY: item.tiltTo, duration: 0.74, ease: "power3.out" },
          item.at
        );
        tl.fromTo(
          words,
          { y: 24, opacity: 0.28 },
          { y: 0, opacity: 1, duration: 0.52, stagger: 0.08, ease: "power2.out" },
          item.lightAt
        );
        tl.to(
          words,
          { color: "#f0ece5", duration: 0.28, stagger: 0.05, ease: "power1.out" },
          item.lightAt
        );
        tl.fromTo(
          accent,
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          item.lightAt + 0.08
        );
        tl.to(panel, { borderTopColor: "#e85d26", duration: 0.24, ease: "none" }, item.lightAt);
      });

      tl.fromTo(
        xhs,
        { x: 320, scale: 0.86, opacity: 0 },
        { x: 0, scale: 1, opacity: 0.48, duration: 0.76, ease: "power3.out" },
        3.28
      );
      tl.fromTo(
        xhsPanel,
        { rotateY: -22 },
        { rotateY: -12, duration: 0.76, ease: "power3.out" },
        3.28
      );
      tl.fromTo(
        gapStamp,
        { scale: 0, opacity: 0, y: 12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.56, ease: "power3.out" },
        4.72
      );

      branches.forEach((path, index) => {
        tl.to(
          path,
          { strokeDashoffset: 0, duration: 1.1, ease: "power2.inOut" },
          3.82 + index * 0.52
        );
      });

      columns.forEach((item, index) => {
        const words = item.root.querySelector("[data-f06-words]");
        tl.to(
          words,
          { y: 184, scaleX: 0.66, scaleY: 0.1, opacity: 0.18, duration: 0.72, ease: "power3.in" },
          4.08 + index * 0.48
        );
      });

      tl.to(trunk, { strokeDashoffset: 0, duration: 0.62, ease: "power3.out" }, 5.92);

      const allColumns = [...columns.map((item) => item.root), xhs];

        const panel = column.querySelector("[data-f06-panel]");

          column,
          { y: -52, duration: 0.46, ease: "power4.in" },
          6.5 + index * 0.035

          panel,
          { height: 78, rotateY: 0, backgroundColor: "#111111", duration: 0.46, ease: "power4.out" },

        { y: -164, scaleX: 1, opacity: 1, duration: 0.82, ease: "power4.out" },
